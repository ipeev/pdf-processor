name: Feature request
description: Suggest a targeted improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current limitation and affected workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired behavior and how it could be tested without paid model calls.
    validations:
      required: true
