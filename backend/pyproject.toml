[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-pdf-processor"
version = "0.12.3"
description = "Async PDF processing with FastAPI, Redis Streams, OpenRouter"
requires-python = ">=3.15,<3.16"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic-settings>=2.5,<3",
    "redis>=5,<7",
    "pypdf>=5,<8",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "pypdfium2>=4.28,<6",
    "Pillow>=10,<13",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: executes paid OpenRouter calls (explicit opt-in)", "redis_integration: requires live Redis", "s3_integration: requires live RustFS", "opensearch_integration: requires live OpenSearch", "pipeline_integration: requires real Redis, RustFS and OpenSearch; mocked AI"]
filterwarnings = ["ignore::DeprecationWarning"]
